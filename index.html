<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F26722" />
    <meta name="description" content="جلوبال ستور — الجملة والتجزئة وصيانة الجوالات والإكسسوارات. Global Store — wholesale, retail & phone repair." />
    <!-- 'unsafe-inline' in script-src is required because the host injects its own
         inline analytics script; without it the page renders blank. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>جلوبال ستور | Global Store</title>
    <style>
      /* Pre-hydration shell: guarantees the user never sees a blank white page,
         even if the JS bundle fails to execute. */
      #gs-boot {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        background: radial-gradient(1200px 600px at 10% -10%, rgba(242,103,34,.18), transparent 60%),
                    #F5F7FA;
        font-family: "IBM Plex Sans Arabic", "Plus Jakarta Sans", system-ui, sans-serif;
      }
      #gs-boot .box { text-align: center; }
      #gs-boot .mark {
        width: 64px; height: 64px; margin: 0 auto; border-radius: 16px;
        background: linear-gradient(135deg, #FF7C39 0%, #F26722 45%, #B33F0C 100%);
        box-shadow: 0 12px 40px -12px rgba(242,103,34,.45);
        animation: gsPulse 1.6s ease-in-out infinite;
      }
      #gs-boot h1 { margin: 18px 0 6px; font-size: 20px; font-weight: 800; color: #182338; }
      #gs-boot p  { margin: 0; font-size: 13px; font-weight: 600; color: #6D809C; }
      #gs-boot .bar { width: 180px; height: 4px; margin: 18px auto 0; border-radius: 99px; background: #E7ECF3; overflow: hidden; }
      #gs-boot .bar i { display: block; width: 40%; height: 100%; border-radius: 99px; background: #F26722; animation: gsSlide 1.1s ease-in-out infinite; }
      #gs-boot .err { display: none; margin-top: 14px; font-size: 12px; color: #B42318; direction: ltr; }
      @keyframes gsPulse { 0%,100% { transform: scale(1); opacity: 1 } 50% { transform: scale(.92); opacity: .75 } }
      @keyframes gsSlide { 0% { margin-left: -40% } 100% { margin-left: 100% } }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="gs-boot">
      <div class="box">
        <div class="mark"></div>
        <h1>جلوبال ستور</h1>
        <p>جارٍ تجهيز النظام…</p>
        <div class="bar"><i></i></div>
        <p class="err" id="gs-boot-err"></p>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
