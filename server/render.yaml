services:
  - type: web
    name: global-store-api
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: global-store-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
databases:
  - name: global-store-db
    plan: free
    databaseName: globalstore
    user: globalstore
